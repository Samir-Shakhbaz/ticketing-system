<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tickets</title>
    <style>
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th, td {
            padding: 10px;
            border: 1px solid #ccc;
            text-align: left;
        }
        th {
            background-color: #f4f4f4;
        }
        th:nth-child(1), td:nth-child(1) {
            width: 5%;
        }
        th:nth-child(2), td:nth-child(2) {
            width: 15%;
        }
        th:nth-child(3), td:nth-child(3) {
            width: 20%;
        }
        th:nth-child(4), td:nth-child(4) {
            width: 10%;
        }
        th:nth-child(5), td:nth-child(5) {
            width: 10%;
        }
        th:nth-child(6), td:nth-child(6) {
            width: 10%;
        }
        th:nth-child(7), td:nth-child(7) {
            width: 15%;
        }
        th:nth-child(8), td:nth-child(8) {
            width: 10%;
        }
        th:nth-child(9), td:nth-child(9) {
            width: 15%;
        }
        /* Align priority dropdown and update button horizontally */
        .inline-form {
            display: flex;
            align-items: center;
        }
        .inline-form select, .inline-form button {
            margin-right: 10px;
        }
    </style>
    <div th:replace="~{fragments :: styles}"></div>
</head>
<body>

<!-- Navigation Bar (Fragment) -->
<div th:replace="~{fragments :: navigation}"></div>

<header>
    <h1>Tickets</h1>
    <!--    <nav>-->
    <!--        <a th:href="@{/tickets/create}">Create Ticket</a>-->
    <!--        <a th:href="@{/users}">View Users</a>-->
    <!--    </nav>-->
</header>

<main>
    <h2>Ticket List</h2>
    <table>
        <thead>
        <tr>
            <th>ID</th>
            <th>Subject</th>
            <th>Description</th>
            <th>Priority</th>
            <th>Update Priority</th>
            <th>Status</th>
            <th>Update Status</th>
            <th>Assignee</th>
            <th>Actions</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="ticket : ${tickets}">
            <td th:text="${ticket.id}"></td>
            <td th:text="${ticket.subject}"></td>
            <td th:text="${ticket.description}"></td>
            <td th:text="${ticket.priority}"></td>
            <td>
                <form class="inline-form" th:action="@{/tickets/update/{id}(id=${ticket.id})}" th:object="${ticket}" method="post">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                    <input type="hidden" th:field="*{subject}" />

                    <select th:field="*{priority}">
                        <option th:value="LOW" th:selected="${ticket.priority == 'LOW'}">Low</option>
                        <option th:value="MEDIUM" th:selected="${ticket.priority == 'MEDIUM'}">Medium</option>
                        <option th:value="HIGH" th:selected="${ticket.priority == 'HIGH'}">High</option>
                        <option th:value="URGENT" th:selected="${ticket.priority == 'URGENT'}">Urgent</option>
                    </select>

                    <button type="submit">Update</button>
                </form>
            </td>
            <td th:text="${ticket.status}"></td>
            <td>
                <form class="inline-form" th:action="@{/tickets/update-status/{id}(id=${ticket.id})}" th:object="${ticket}" method="post">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                    <input type="hidden" th:field="*{subject}" />

                    <select th:field="*{status}">
                        <option th:value="OPEN" th:selected="${ticket.status == 'OPEN'}">Open</option>
                        <option th:value="IN_PROGRESS" th:selected="${ticket.status == 'IN_PROGRESS'}">In Progress</option>
                        <option th:value="CLOSED" th:selected="${ticket.status == 'CLOSED'}">Closed</option>
                    </select>

                    <button type="submit">Update</button>
                </form>
            </td>

            <td th:text="${ticket.assignee != null ? ticket.assignee.username : 'Unassigned'}"></td>

            <td>
                <form th:action="@{/tickets/assign/{ticketId}(ticketId=${ticket.id})}" method="post">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

                    <select name="assigneeId" required>
                        <option value="" disabled selected>Select Assignee</option>
                        <option th:each="user : ${users}" th:value="${user.id}" th:text="${user.username}"></option>
                    </select>
                    <button type="submit">Assign</button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>

    <p th:if="${#lists.isEmpty(tickets)}">No tickets available.</p>
</main>

<footer>
    <p>&copy; 2024 Ticketing System</p>
</footer>

<div th:replace="~{fragments :: scripts}"></div>

</body>
</html>
