<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Users</title>
  <div th:replace="~{fragments :: styles}"></div> <!-- Includes CSS styles -->
</head>
<body>
<div th:replace="~{fragments :: navigation}"></div> <!-- Includes navbar -->

<header>
  <h1>Users</h1>
</header>

<main>
  <h2>User List</h2>
  <table class="table table-striped">
    <thead>
    <tr>
      <th>ID</th>
      <th>Username</th>
      <th>Role</th>
      <th>Actions</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="user : ${users}">
      <td th:text="${user.id}"></td>
      <td th:text="${user.username}"></td>
      <td th:text="${user.role}"></td>
      <td>
        <!-- Delete User Form -->
        <form th:action="@{/users/delete/{id}(id=${user.id})}" method="post" style="display:inline;">
          <input type="hidden" name="_method" value="delete">
          <button class="btn btn-danger" type="submit">Delete</button>
        </form>
      </td>
    </tr>
    </tbody>
  </table>

  <!-- Message if no users are found -->
  <p th:if="${#lists.isEmpty(users)}">No users available.</p>
</main>

<footer>
  <p>&copy; 2024 Ticketing System</p>
</footer>

<div th:replace="~{fragments :: scripts}"></div>
</body>
</html>
