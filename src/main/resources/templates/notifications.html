<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Notifications</title>

    <div th:replace="~{fragments :: styles}"></div> <!-- Includes CSS styles -->
</head>
<body>
<div th:replace="~{fragments :: navigation}"></div> <!-- Includes navbar -->

<h1>Notifications</h1>

<!-- Table for notifications -->
<table class="table table-striped">
    <thead>
    <tr>
        <th>Message</th>
        <th>Received At</th>
        <th>Status</th>
        <th>Action</th>
    </tr>
    </thead>
    <tbody>
    <!-- Iterate over notifications -->
    <tr th:each="notification : ${notifications}">
        <td th:text="${notification.message}"></td>
        <td th:text="${#temporals.format(notification.createdAt, 'yyyy-MM-dd HH:mm')}"></td>
        <td th:text="${notification.isRead ? 'Read' : 'Unread'}"></td> <!-- Display read/unread status -->
        <td>
            <!-- Mark as Read button if notification is unread -->
            <button th:if="${!notification.isRead}"
                    th:onclick="'markAsRead(' + ${notification.id} + ');'"
                    class="btn btn-primary">
                Mark as Read
            </button>
        </td>
    </tr>
    </tbody>
</table>

<!-- Message if there are no notifications -->
<div th:if="${#lists.isEmpty(notifications)}">No notifications</div>

<script>
    async function markAsRead(id) {
        await fetch(`/notifications/${id}/read`, { method: 'PATCH' });
        location.reload();
    }
</script>

<div th:replace="~{fragments :: scripts}"></div> <!-- Includes JavaScript -->
</body>
</html>
