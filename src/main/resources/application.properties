spring.datasource.url=jdbc:mysql://localhost:3399/ticketing-system
spring.datasource.username=
spring.datasource.password=m

logging.level.com.sash=DEBUG

# Specify Hibernate dialect based on your database
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Optional - Show SQL in console
spring.jpa.show-sql=true

# Optional - Automatically update database schema
spring.jpa.hibernate.ddl-auto=update

# SMTP Server Configuration
spring.mail.host=smtp.example.com
spring.mail.port=587
spring.mail.username=some_email@example.com
spring.mail.password=some_email_password
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Optional: Set the default protocol (e.g., smtp)
spring.mail.protocol=smtp
